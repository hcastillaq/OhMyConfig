# ==============================================================================
# CONFIGURACIÓN DE LAZYGIT (TEMA TOKYONIGHT NIGHT & DELTA INTEGRATION)
# ==============================================================================

gui:
  theme:
    activeBorderColor:
      - '#7aa2f7'
      - bold
    inactiveBorderColor:
      - '#565f89'
    searchingActiveBorderColor:
      - '#ff9e64'
      - bold
    optionsTextColor:
      - '#7dcfff'
    selectedLineBgColor:
      - '#283457'
    cherryPickedCommitBgColor:
      - '#2e3c64'
    cherryPickedCommitFgColor:
      - '#7aa2f7'
    unstagedChangesColor:
      - '#f7768e'
    defaultFgColor:
      - '#c0caf5'
  showIcons: true
  nerdFontsVersion: "3"

git:
  paging:
    colorArg: always
    pager: delta --dark --paging=never --line-numbers
