# ==============================================================================
# CONFIGURACIÓN DE STARSHIP (TEMA TOKYONIGHT NIGHT)
# ==============================================================================

# --- CONFIGURACIÓN GLOBAL ---
add_newline = false
command_timeout = 2000

# --- ESTRUCTURA DEL PROMPT ---
format = """
$kubernetes$directory$git_branch$git_status$mise$nodejs$python$java$cmd_duration
$character
"""

# ==============================================================================
# MÓDULOS DE ENTORNO Y HERRAMIENTAS
# ==============================================================================

# --- DIRECTORY (Ruta actual) ---
[directory]
truncation_length = 3
truncate_to_repo = true
format = "[$path]($style) "
style = "bold fg:#7dcfff" # Cyan Tokyonight
read_only = " 󰌾"
read_only_style = "bold fg:#f7768e"

# --- KUBERNETES ---
[kubernetes]
disabled = false
symbol = "󱃾 "
format = '[$symbol$context]($style) '
style = 'bold fg:#7aa2f7' # Azul Tokyonight
detect_files = []
detect_extensions = []
detect_folders = []

# --- MISE ---
[mise]
disabled = false
symbol = "󰒋 "
format = '[$symbol$tool@$version]($style) '
style = 'bold fg:#bb9af7' # Magenta/Púrpura Tokyonight

# --- NODEJS ---
[nodejs]
symbol = " "
format = '[$symbol$version]($style) '
style = 'bold fg:#9ece6a' # Verde Tokyonight
detect_extensions = ["js", "ts", "tsx"]
detect_files = ["package.json", ".nvmrc", "bun.lockb", "pnpm-lock.yaml"]
detect_folders = ["node_modules"]

# --- PYTHON ---
[python]
symbol = " "
format = '[$symbol($version )(\((virtualenv) \))]($style) '
style = "bold fg:#e0af68" # Amarillo Tokyonight
detect_files = [".venv", "uv.lock", "pyproject.toml", "requirements.txt"]
detect_extensions = ["py"]

# --- JAVA ---
[java]
symbol = " "
format = '[$symbol$version]($style) '
style = 'bold fg:#f7768e' # Rosa/Rojo Tokyonight
detect_extensions = ["java", "class", "jar", "gradle", "pom.xml"]

# ==============================================================================
# MÓDULOS DE GIT
# ==============================================================================

[git_branch]
symbol = " "
format = '[$symbol$branch]($style) '
style = 'bold fg:#bb9af7' # Magenta Tokyonight

[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = 'bold fg:#ff9e64' # Naranja Tokyonight
conflicted = "󰞇 "
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "󰋗 ${count} "
staged = "+${count} "
modified = "!${count} "
deleted = "󰆴 "

# ==============================================================================
# UTILIDADES ADICIONALES
# ==============================================================================

# --- TIEMPO DE EJECUCIÓN ---
[cmd_duration]
min_time = 2000
format = '[󱑂 $duration]($style) '
style = 'bold fg:#737aa2' # Gris azulado Tokyonight

# ==============================================================================
# CARÁCTER DE ENTRADA (PROMPT CHARACTER)
# ==============================================================================
[character]
success_symbol = '[❯](bold fg:#7aa2f7)' # Azul Tokyonight
error_symbol = '[❯](bold fg:#f7768e)'   # Rojo Tokyonight
