name: Test macOS

on:
  push:
    branches:
      - feature/go-cli-rewrite

jobs:
  with-brew:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.0"

      - name: Build
        run: go build -o dist/omc ./cmd/omc

      - name: Verify Homebrew is installed
        run: |
          if ! command -v brew >/dev/null 2>&1; then
            echo "Homebrew no está instalado"
            exit 1
          fi

          echo "Homebrew está instalado"

      - name: Install
        run: ./dist/omc install

  without-brew:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.0"

      - name: Build
        run: go build -o dist/omc ./cmd/omc

      - name: Remove Homebrew
        run: /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/uninstall.sh)" -- --force

      - name: Verify Homebrew is not installed
        run: |
          if command -v brew >/dev/null 2>&1; then
            echo "Homebrew todavía está instalado"
            exit 1
          fi

          echo "Homebrew no está instalado"

      - name: Install should fail
        run: |
          if ./dist/omc install; then
            echo "OMC no falló como se esperaba"
            exit 1
          fi

          echo "OMC falló correctamente"
