name: Test macOS

on:
  push:
    branches:
      - feature/go-cli-rewrite

jobs:
  test:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.0"

      - name: Build
        run: go build -o omc ./cmd/omc

      - name: Install
        run: ./omc install
