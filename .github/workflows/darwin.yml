name: Test macOS

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: Build
        run: go build -o omc ./cmd/omc

      - name: Install
        run: ./omc install
